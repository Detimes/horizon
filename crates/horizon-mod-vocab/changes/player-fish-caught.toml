ids = ["method:Hooks::player_fish"]
why = "player_fish gains a caught argument: on a state-4 reel-in it holds the entity id the bobber hooked, and it is None in every other state. Paper's PlayerFishEvent exposes the same caught entity, so mods porting fishing logic can read it."
migrate = "Rebuild listeners against the new signature, which takes caught after state, and read it as an Option of the entity id; it is only set on a state-4 reel-in."
